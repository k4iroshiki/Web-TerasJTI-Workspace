
<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reservasi - Teras JTI</title>
  </head>

  <body>
    <header class="sub">
      <a class="kembali" href="jadwal.html" aria-label="Kembali">
        &larr;
      </a>
      <h1>Reservasi</h1>
    </header>

    <main>
      <form id="reservasi" action="pembayaran.html" method="get">
        <div>
          <label for="tempat">Tempat</label>
          <input
            type="text"
            id="tempat"
            name="tempat"
            value="Ruang Diskusi"
            readonly
          />
        </div>

        <div>
          <label for="tanggal">Tanggal</label>
          <input
            type="text"
            id="tanggal"
            name="tanggal"
            value="Rabu, 28 Oktober 2026"
            readonly
          />
        </div>

        <div>
          <label for="mulai">Jam Mulai</label>
          <input
            type="time"
            id="mulai"
            name="mulai"
            value="13:00"
            required
          />
        </div>

        <div>
          <label for="selesai">Jam Selesai</label>
          <input
            type="time"
            id="selesai"
            name="selesai"
            value="15:00"
            min="13:00"
            required
          />
        </div>

        <div>
          <label for="orang">Jumlah Orang</label>
          <select id="orang" name="orang" required>
            <option value="1">1 Orang</option>
            <option value="2">2 Orang</option>
            <option value="3">3 Orang</option>
            <option value="4" selected>4 Orang</option>
            <option value="5">5 Orang</option>
            <option value="6">6 Orang</option>
          </select>
        </div>
      </form>
    </main>

    <div class="aksi">
      <button type="submit" form="reservasi">
        Kirim Reservasi
      </button>
    </div>
  </body>
</html>
